<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>login - sistema espe</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="css/login.css" rel="stylesheet" type="text/css" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
</head>

<body class="login-container">
  <header class="login-header">
    <div class="login-logo">espe</div>
    <h1>sistema de gestión de aulas de biblioteca</h1>
    <p>universidad de las fuerzas armadas espe</p>
  </header>

  <main class="login-main">
    <div class="login-card">
      <h2>iniciar sesión</h2>

      <form id="form-login" autocomplete="off">
        <div class="form-grupo-login">
          <label for="input-usuario">usuario:</label>
          <input id="input-usuario" type="text" class="login-input" placeholder="ej: admin" required />
          <div id="error-usuario" class="error-mensaje" style="display:none;"></div>
        </div>

        <div class="form-grupo-login">
          <label for="input-password">contraseña:</label>
          <input id="input-password" type="password" class="login-input" placeholder="ingrese su contraseña" required />
          <div id="error-password" class="error-mensaje" style="display:none;"></div>
        </div>

        <div id="error-general" class="error-mensaje" style="display:none;"></div>

        <button type="submit" class="btn-login" id="btn-login">ingresar</button>
      </form>

      <div style="margin-top:10px;text-align:center;">
        <a href="pages/registro.html" style="color:inherit;text-decoration:underline;">crear cuenta</a>
      </div>
    </div>
  </main>

  <footer class="login-footer">
    <p>sistema de gestión de aulas de biblioteca - universidad de las fuerzas armadas espe</p>
  </footer>

  <script src="js/login.js" defer></script>
</body>
</html>
